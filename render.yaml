# Native Node runtime: no Docker daemon or container builds required.
# One private, single-tenant instance. Review paid resources before provisioning.
services:
  - type: web
    name: webrova
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: workspaces
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SANDBOX_DIR
        value: /var/data/sandboxes
      - key: ACCESS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: SANDBOX_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
